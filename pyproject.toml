[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guildporter"
version = "1.0.1"
description = "Migrate Discord guild message history between servers via webhook masquerading"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Daniel Ray Wright" }]
keywords = ["discord", "migration", "webhook", "guild", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.scripts]
guild-migrate = "guild_migrator.cli:main"

[project.urls]
Homepage = "https://github.com/mortis2600/guildporter"

[tool.setuptools.packages.find]
where = ["src"]
